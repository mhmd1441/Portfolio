<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <meta
      name="description"
      content="Mohamad Moumneh — Backend & Full-Stack Developer specializing in Laravel, React, React Native, ASP.NET Core, and PostgreSQL. Based in Beirut, Lebanon."
    />

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / LinkedIn / WhatsApp / Discord / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohamad Moumneh" />
    <meta property="og:url" content="https://mohamadmoumneh.com/" />
    <meta property="og:title" content="Mohamad Moumneh | Developer Portfolio" />
    <meta
      property="og:description"
      content="Backend & Full-Stack Developer specializing in Laravel, React, React Native, and ASP.NET Core. Based in Beirut, Lebanon. View my projects, experience, and certifications."
    />
    <meta property="og:image" content="https://mohamadmoumneh.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://mohamadmoumneh.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mohamad Moumneh — Full-Stack Developer, Computer Science Graduate" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohamad Moumneh | Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Backend & Full-Stack Developer specializing in Laravel, React, React Native, and ASP.NET Core."
    />
    <meta name="twitter:image" content="https://mohamadmoumneh.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Mohamad Moumneh — Full-Stack Developer, Computer Science Graduate" />

    <!-- Fonts: preconnect first so the font request starts in parallel with CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap"
    />

    <title>Mohamad Moumneh | Portfolio</title>

    <!-- Loading screen shown until the JavaScript bundle arrives; React replaces it on first render. -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07111f;
      }
      #preloader::after {
        content: "";
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        animation: preloader-spin 0.9s linear infinite;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader::after { animation: none; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div id="preloader" role="status" aria-label="Loading"></div></div>
  </body>
</html>
