<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#07111f"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#0d1c2e" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#0d1c2e" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#0d1c2e" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#0d1c2e" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="80" y="180" width="4" height="270" fill="#3b82f6" rx="2"/>

  <!-- Name -->
  <text x="112" y="270" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#f1f5f9">Mohamad</text>
  <text x="112" y="348" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#f1f5f9">Moumneh</text>

  <!-- Title -->
  <text x="112" y="400" font-family="Arial, sans-serif" font-size="24" fill="#3b82f6" font-weight="400" letter-spacing="2">BACKEND &amp; FULL-STACK DEVELOPER</text>

  <!-- Divider -->
  <line x1="112" y1="425" x2="600" y2="425" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Stack -->
  <text x="112" y="460" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Laravel · React · ASP.NET Core · PostgreSQL</text>

  <!-- Domain -->
  <text x="112" y="510" font-family="Arial, sans-serif" font-size="22" fill="#3b82f6">mohamadmoumneh.com</text>

  <!-- M monogram right side -->
  <rect x="860" y="165" width="200" height="200" rx="16" fill="#0d1c2e"/>
  <text x="960" y="310" font-family="Georgia, serif" font-size="160" font-weight="700" fill="#3b82f6" text-anchor="middle">M</text>
</svg>
